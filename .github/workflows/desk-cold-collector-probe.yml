name: Desk 1.3.0 cold Windows collector diagnosis

on:
  push:
    branches: [probe/desk-130-cold-collector-20261128-r2]

permissions:
  contents: read

concurrency:
  group: desk-a2-cold-collector-20261128
  cancel-in-progress: false

env:
  DESKTOP_SHA: "4adad8b9f5e90e0ff62a78ca9ed785b04958c9de"
  DESKTOP_TREE: "55faa6bf326fdb8e3874894479aed23cfa0f5091"
  CORE_SHA: "25276907b92393a117e5518a51b47bdb5a34ec5e"
  CORE_TREE: "a2b7149c1f53fe1d5e20bbb31e79c73d84aba272"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  BUN_WINDOWS_BASELINE_SHA256: "39f12024edc27d3706baa7b72a06156896b536af61472e0f9a6fe9c5e25b97cc"

jobs:
  build_windows:
    name: Build one-use signed Windows fixture
    if: github.repository == 'hara-cli/hara-desktop' && github.event.created && !github.event.deleted && !github.event.forced && github.run_attempt == '1'
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.upload.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
      proof_sha256: ${{ steps.pack.outputs.proof_sha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.sha }}
          path: probe
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ env.DESKTOP_SHA }}
          path: desk
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: desk/.node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-msvc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: desk/.bun-version
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-windows-x64-baseline.zip
      - name: Verify pinned Windows baseline Bun bytes
        working-directory: desk
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA256="$(sha256sum "$(command -v bun)" | awk '{print $1}')"
          [ "$ACTUAL_SHA256" = "$BUN_WINDOWS_BASELINE_SHA256" ] || {
            echo "Windows baseline Bun digest mismatch: $ACTUAL_SHA256" >&2
            exit 1
          }
      - name: Validate pinned build toolchain
        working-directory: desk
        shell: bash
        run: bash scripts/check-build-toolchain.sh
      - name: Install locked Desktop dependencies with bounded registry retries
        working-directory: desk
        shell: bash
        run: ./scripts/npm-ci-retry.sh
      - name: Audit production dependencies with transient-only retries
        working-directory: desk
        shell: bash
        run: ./scripts/npm-audit-retry.sh
      - name: Prepare the clean one-use-key fixture checkout
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/cold-collector-key"
          [ ! -e "$key" ] && [ ! -e "$key.pub" ] || exit 1
          node desk/node_modules/@tauri-apps/cli/tauri.js signer generate --ci -p "" -w "$key" >/dev/null
          node probe/scripts/desk-cold-collector-probe.mjs fixture desk
      - name: Install locked builder dependencies in the fixture
        working-directory: ${{ runner.temp }}/cold-collector-fixture
        shell: bash
        run: ./scripts/npm-ci-retry.sh
      - name: Build and execute-smoke pinned hara sidecar
        working-directory: ${{ runner.temp }}/cold-collector-fixture
        shell: bash
        run: |
          set -euo pipefail
          DESK_SOURCE="$(pwd -P)"
          CLI_VERSION="$(tr -d '[:space:]' < "$DESK_SOURCE/src-tauri/binaries/SIDECAR_VERSION")"
          PINNED_CLI_VERSION="1.3.0"
          CLI_SHA="25276907b92393a117e5518a51b47bdb5a34ec5e"
          [ "$CLI_VERSION" = "$PINNED_CLI_VERSION" ] || {
            echo "SIDECAR_VERSION changed after source pinning: $CLI_VERSION != $PINNED_CLI_VERSION" >&2
            exit 1
          }
          [[ "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid SIDECAR_VERSION: $CLI_VERSION" >&2
            exit 1
          }
          CLI_DIR="$RUNNER_TEMP/hara-cli"
          git init --quiet "$CLI_DIR"
          git -C "$CLI_DIR" remote add origin https://github.com/hara-cli/hara.git
          git -C "$CLI_DIR" fetch --quiet --depth 1 origin "$CLI_SHA"
          [ "$(git -C "$CLI_DIR" rev-parse 'FETCH_HEAD^{commit}')" = "$CLI_SHA" ] || {
            echo "hara-cli tag moved after source pinning" >&2
            exit 1
          }
          git -C "$CLI_DIR" checkout --quiet --detach "$CLI_SHA"
          core_tree=$(git -C "$CLI_DIR" rev-parse 'HEAD^{tree}')
          [[ "$core_tree" == a2b7149c1f53fe1d5e20bbb31e79c73d84aba272 ]] || exit 1
          cd "$CLI_DIR"
          [ "$(node -p 'require("./package.json").version')" = "$CLI_VERSION" ] || {
            echo "hara-cli tag/package version mismatch" >&2
            exit 1
          }
          npm ci
          npm run build
          node "$DESK_SOURCE/scripts/windows-vault-bundle.mjs" prepare "$CLI_SHA"
          for attempt in 1 2 3; do
            rm -f dist/bin/hara-sidecar.exe
            if bun scripts/build-binary.ts dist/bin/hara-sidecar "" dist/cli.js desktop-sidecar; then
              break
            fi
            [ "$attempt" -lt 3 ] || {
              echo "sidecar compilation failed after $attempt attempts" >&2
              exit 1
            }
            echo "sidecar compilation attempt $attempt failed; retrying a possibly incomplete Bun target download" >&2
            sleep $((attempt * 5))
          done
          [ "$(git -C "$CLI_DIR" rev-parse HEAD)" = "$CLI_SHA" ] || {
            echo "hara-cli HEAD changed while building the sidecar" >&2
            exit 1
          }
          CLI_STATUS="$(git -C "$CLI_DIR" status --porcelain)"
          [ -z "$CLI_STATUS" ] || {
            echo "hara-cli source changed while building the sidecar" >&2
            git -C "$CLI_DIR" status --short >&2
            exit 1
          }
          node "$DESK_SOURCE/scripts/sidecar-smoke.mjs" \
            "dist/bin/hara-sidecar.exe" "$CLI_VERSION" "x86_64-pc-windows-msvc"
          mkdir -p "$DESK_SOURCE/src-tauri/binaries"
          cp "dist/bin/hara-sidecar.exe" \
            "$DESK_SOURCE/src-tauri/binaries/hara-x86_64-pc-windows-msvc.exe"
          node "$DESK_SOURCE/scripts/windows-vault-bundle.mjs" stage "$CLI_SHA"
          # Tauri resolves every externalBin before compilation. Hydrate the checksum-pinned Herdr
          # runtime for this exact matrix target beside hara, rather than relying on a developer
          # workstation artifact that is intentionally absent from the release checkout.
          node "$DESK_SOURCE/scripts/refresh-herdr-runtime.mjs" "x86_64-pc-windows-msvc"
          node "$DESK_SOURCE/scripts/check-runtime-distribution.mjs"
      - name: Build local packages with the one-use key
        working-directory: ${{ runner.temp }}/cold-collector-fixture
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          NO_STRIP: "true"
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/cold-collector-key"
          trap 'rm -f -- "$key"' EXIT
          TAURI_SIGNING_PRIVATE_KEY=$(cat "$key")
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || exit 1
          printf '::add-mask::%s\n' "$TAURI_SIGNING_PRIVATE_KEY"
          export TAURI_SIGNING_PRIVATE_KEY
          node scripts/windows-vault-bundle.mjs build x86_64-pc-windows-msvc
      - name: Smoke the exact locally signed packages
        working-directory: ${{ runner.temp }}/cold-collector-fixture
        shell: bash
        env:
          TAURI_TARGET: x86_64-pc-windows-msvc
        run: node scripts/package-smoke.mjs
      - name: Seal the fixture identity and collector-format payload
        id: pack
        shell: bash
        run: node probe/scripts/desk-cold-collector-probe.mjs pack desk
      - name: Upload the immutable rehearsal transfer
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-cold-collector-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cold-collector-transfer/
          if-no-files-found: error
          retention-days: 1

  cold_collect:
    name: Collect and verify the fixture on a fresh Windows VM
    needs: [build_windows]
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      COLD_ARTIFACT_ID: ${{ needs.build_windows.outputs.artifact_id }}
      COLD_ARCHIVE_SHA256: ${{ needs.build_windows.outputs.archive_sha256 }}
      COLD_MANIFEST_SHA256: ${{ needs.build_windows.outputs.manifest_sha256 }}
      COLD_PROOF_SHA256: ${{ needs.build_windows.outputs.proof_sha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.sha }}
          path: probe
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ env.DESKTOP_SHA }}
          path: desk
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: desk/.node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-msvc
      - name: Install locked Desktop dependencies with bounded registry retries
        working-directory: desk
        shell: bash
        run: ./scripts/npm-ci-retry.sh
      - name: Audit production dependencies with transient-only retries
        working-directory: desk
        shell: bash
        run: ./scripts/npm-audit-retry.sh
      - name: Require the exact builder artifact before download
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COLD_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          for digest in "$COLD_ARCHIVE_SHA256" "$COLD_MANIFEST_SHA256" "$COLD_PROOF_SHA256"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
          done
      - name: Download exact immutable transfer ZIP
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.build_windows.outputs.artifact_id }}
          path: ${{ runner.temp }}/cold-collector-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify clean-tree collection and signature rejection
        shell: bash
        run: node probe/scripts/desk-cold-collector-probe.mjs collect desk
      - name: Upload only the schema-3 receipt and diagnostic readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-cold-collector-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cold-collector-evidence/*.json
          if-no-files-found: error
          retention-days: 7
