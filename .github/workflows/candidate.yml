      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with: { toolchain: '1.97.0', targets: '${{ matrix.target }}' }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: orchestration/.bun-version
          bun-download-url: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-windows-x64-baseline.zip' || '' }}
      - name: Linux native extraction and SDK dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libarchive-tools
      - name: Provision retained job evidence
        id: evidence
        env:
          CANDIDATE_EVIDENCE_ROOT: ${{ github.workspace }}/candidate-evidence/${{ github.run_id }}/${{ github.run_attempt }}/native_verify/${{ matrix.target }}
          CANDIDATE_EVIDENCE_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const required = key => { const value = process.env[key]; assert(typeof value === 'string' && value.length > 0 && !/[\r\n\0]/.test(value), 'missing or invalid ' + key); return value; };
          const accountHome = os.userInfo().homedir, uid = process.getuid?.();
          const folded = value => value.replaceAll('\\', '/').toLowerCase();
          const forbidden = ['/tmp', '/private/tmp', '/var/folders', '/private/var/folders', path.join(accountHome, 'Library', 'Caches'), path.join(accountHome, '.hara')].map(folded);
          const canonicalInput = value => { assert(path.isAbsolute(value) && !value.split(/[\\/]/).includes('..'), 'absolute evidence path without traversal required'); const normalized = path.normalize(value); assert(!forbidden.some(prefix => { const f = folded(normalized); return f === prefix || f.startsWith(prefix + '/'); }), 'forbidden evidence prefix'); return normalized; };
          const requested = canonicalInput(required('CANDIDATE_EVIDENCE_ROOT'));
          const workspaceInput = canonicalInput(required('GITHUB_WORKSPACE'));
          const runId = required('GITHUB_RUN_ID'), attempt = required('GITHUB_RUN_ATTEMPT'), job = required('GITHUB_JOB'), target = required('CANDIDATE_EVIDENCE_TARGET');
          assert(/^[1-9][0-9]{0,19}$/.test(runId) && /^[1-9][0-9]{0,5}$/.test(attempt), 'invalid run or attempt');
          assert(/^[a-z][a-z0-9_]{0,47}$/.test(job), 'invalid job');
          assert(['controller', 'aarch64-apple-darwin', 'x86_64-apple-darwin', 'x86_64-unknown-linux-gnu', 'x86_64-pc-windows-msvc'].includes(target), 'invalid evidence target');
          const commandFiles = ['GITHUB_ENV', 'GITHUB_OUTPUT'].map(key => { const file = required(key); assert(path.isAbsolute(file), 'absolute runner command file required'); return file; });
          const identity = directory => {
            const st = fs.lstatSync(directory, { bigint: true });
            assert(st.isDirectory() && !st.isSymbolicLink(), 'plain evidence directory required');
            if (uid !== undefined) assert(Number(st.uid) === uid && (Number(st.mode) & 0o022) === 0, 'unsafe evidence owner or mode');
            assert.equal(fs.realpathSync(directory), directory, 'evidence alias refused');
            return [st.dev, st.ino, st.uid].map(String).join(':');
          };
          assert.equal(fs.realpathSync(workspaceInput), workspaceInput, 'workspace alias refused');
          identity(workspaceInput);
          const parts = ['candidate-evidence', runId, attempt, job, target], root = path.join(workspaceInput, ...parts);
          assert.equal(requested, root, 'evidence must match this exact workspace/run/attempt/job/target');
          for (const file of commandFiles) {
            const st = fs.lstatSync(file, { bigint: true });
            assert(st.isFile() && !st.isSymbolicLink() && Number(st.nlink) === 1, 'plain runner command file required');
            if (uid !== undefined) assert.equal(Number(st.uid), uid, 'foreign runner command file');
          }
          let directory = workspaceInput;
          for (const part of parts.slice(0, -1)) {
            directory = path.join(directory, part);
            try { fs.mkdirSync(directory, { mode: 0o700 }); } catch (error) { if (error.code !== 'EEXIST') throw error; }
            identity(directory);
          }
          // An existing job/attempt leaf is retained and rejected; never reset or delete it.
          fs.mkdirSync(root, { mode: 0o700 }); identity(root);
          const home = path.join(root, 'synthetic-home'), tmp = path.join(root, 'tmp'), output = path.join(tmp, 'output');
          for (const value of [home, tmp, output]) { fs.mkdirSync(value, { mode: 0o700 }); identity(value); }
          const anchors = new Map([root, home, tmp, output].map(value => [value, identity(value)]));
          const authority = { CANDIDATE_EVIDENCE_ROOT: root, HARA_WRAPPER_EVIDENCE_ROOT: root, CANDIDATE_OUTPUT_DIR: output,
            USERPROFILE: home, CFFIXED_USER_HOME: home, HARA_HOME: path.join(home, '.hara'),
            XDG_CONFIG_HOME: path.join(home, '.config'), XDG_DATA_HOME: path.join(home, '.local', 'share'), XDG_CACHE_HOME: path.join(home, '.cache'),
            npm_config_cache: path.join(home, '.npm'), npm_config_userconfig: path.join(home, '.npmrc'), npm_config_globalconfig: path.join(home, '.npmrc-global'),
            npm_config_prefix: path.join(home, '.local'), NO_UPDATE_NOTIFIER: '1', npm_config_update_notifier: 'false', NODE_DISABLE_COMPILE_CACHE: '1',
            TMP: tmp, TEMP: tmp, HOME: home, TMPDIR: tmp };
          for (const [value, expected] of anchors) assert.equal(identity(value), expected, 'evidence identity changed before binding');
          fs.appendFileSync(commandFiles[0], Object.entries(authority).map(([key, value]) => key + '=' + value + '\n').join(''));
          fs.appendFileSync(commandFiles[1], 'root=' + root + '\nhome=' + home + '\ntmp=' + tmp + '\noutput=' + output + '\n');
          NODE
      - name: Native package smoke, signature verification and private old-version upgrade checks
        run: node scripts/candidate-native.mjs verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-verified-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.output }}/verified-output/*
          if-no-files-found: error
          retention-days: 7
