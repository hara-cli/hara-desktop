name: candidate

on:
  push:
    branches: [candidate/1.1.0-d8d109b]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: hara-desktop-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  CANDIDATE_DESKTOP_DIR: ${{ github.workspace }}/app
  CANDIDATE_CORE_DIR: ${{ github.workspace }}/core
  GH_TOKEN: ${{ github.token }}
  # Per-process checkout policy; never edit a persistent runner's global git config.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

defaults:
  run:
    shell: bash
    working-directory: orchestration

jobs:
  admission:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: orchestration
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: orchestration/.node-version
      - name: Provision retained job evidence
        id: evidence
        env:
          CANDIDATE_EVIDENCE_ROOT: ${{ github.workspace }}/candidate-evidence/${{ github.run_id }}/${{ github.run_attempt }}/admission/controller
          CANDIDATE_EVIDENCE_TARGET: controller
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const required = key => { const value = process.env[key]; assert(typeof value === 'string' && value.length > 0 && !/[\r\n\0]/.test(value), 'missing or invalid ' + key); return value; };
          const accountHome = os.userInfo().homedir, uid = process.getuid?.();
          const folded = value => value.replaceAll('\\', '/').toLowerCase();
          const forbidden = ['/tmp', '/private/tmp', '/var/folders', '/private/var/folders', path.join(accountHome, 'Library', 'Caches'), path.join(accountHome, '.hara')].map(folded);
          const canonicalInput = value => { assert(path.isAbsolute(value) && !value.split(/[\\/]/).includes('..'), 'absolute evidence path without traversal required'); const normalized = path.normalize(value); assert(!forbidden.some(prefix => { const f = folded(normalized); return f === prefix || f.startsWith(prefix + '/'); }), 'forbidden evidence prefix'); return normalized; };
          const requested = canonicalInput(required('CANDIDATE_EVIDENCE_ROOT'));
          const workspaceInput = canonicalInput(required('GITHUB_WORKSPACE'));
          const runId = required('GITHUB_RUN_ID'), attempt = required('GITHUB_RUN_ATTEMPT'), job = required('GITHUB_JOB'), target = required('CANDIDATE_EVIDENCE_TARGET');
          assert(/^[1-9][0-9]{0,19}$/.test(runId) && /^[1-9][0-9]{0,5}$/.test(attempt), 'invalid run or attempt');
          assert(/^[a-z][a-z0-9_]{0,47}$/.test(job), 'invalid job');
          assert(['controller', 'aarch64-apple-darwin', 'x86_64-apple-darwin', 'x86_64-unknown-linux-gnu', 'x86_64-pc-windows-msvc'].includes(target), 'invalid evidence target');
          const commandFiles = ['GITHUB_ENV', 'GITHUB_OUTPUT'].map(key => { const file = required(key); assert(path.isAbsolute(file), 'absolute runner command file required'); return file; });
          const identity = directory => {
            const st = fs.lstatSync(directory, { bigint: true });
            assert(st.isDirectory() && !st.isSymbolicLink(), 'plain evidence directory required');
            if (uid !== undefined) assert(Number(st.uid) === uid && (Number(st.mode) & 0o022) === 0, 'unsafe evidence owner or mode');
            assert.equal(fs.realpathSync(directory), directory, 'evidence alias refused');
            return [st.dev, st.ino, st.uid].map(String).join(':');
          };
          assert.equal(fs.realpathSync(workspaceInput), workspaceInput, 'workspace alias refused');
          identity(workspaceInput);
          const parts = ['candidate-evidence', runId, attempt, job, target], root = path.join(workspaceInput, ...parts);
          assert.equal(requested, root, 'evidence must match this exact workspace/run/attempt/job/target');
          for (const file of commandFiles) {
            const st = fs.lstatSync(file, { bigint: true });
            assert(st.isFile() && !st.isSymbolicLink() && Number(st.nlink) === 1, 'plain runner command file required');
            if (uid !== undefined) assert.equal(Number(st.uid), uid, 'foreign runner command file');
          }
          let directory = workspaceInput;
          for (const part of parts.slice(0, -1)) {
            directory = path.join(directory, part);
            try { fs.mkdirSync(directory, { mode: 0o700 }); } catch (error) { if (error.code !== 'EEXIST') throw error; }
            identity(directory);
          }
          // An existing job/attempt leaf is retained and rejected; never reset or delete it.
          fs.mkdirSync(root, { mode: 0o700 }); identity(root);
          const home = path.join(root, 'synthetic-home'), tmp = path.join(root, 'tmp'), output = path.join(tmp, 'output');
          for (const value of [home, tmp, output]) { fs.mkdirSync(value, { mode: 0o700 }); identity(value); }
          const anchors = new Map([root, home, tmp, output].map(value => [value, identity(value)]));
          const authority = { CANDIDATE_EVIDENCE_ROOT: root, HARA_WRAPPER_EVIDENCE_ROOT: root, CANDIDATE_OUTPUT_DIR: output,
            USERPROFILE: home, CFFIXED_USER_HOME: home, HARA_HOME: path.join(home, '.hara'),
            XDG_CONFIG_HOME: path.join(home, '.config'), XDG_DATA_HOME: path.join(home, '.local', 'share'), XDG_CACHE_HOME: path.join(home, '.cache'),
            npm_config_cache: path.join(home, '.npm'), npm_config_userconfig: path.join(home, '.npmrc'), npm_config_globalconfig: path.join(home, '.npmrc-global'),
            npm_config_prefix: path.join(home, '.local'), NO_UPDATE_NOTIFIER: '1', npm_config_update_notifier: 'false', NODE_DISABLE_COMPILE_CACHE: '1',
            TMP: tmp, TEMP: tmp, HOME: home, TMPDIR: tmp };
          for (const [value, expected] of anchors) assert.equal(identity(value), expected, 'evidence identity changed before binding');
          fs.appendFileSync(commandFiles[0], Object.entries(authority).map(([key, value]) => key + '=' + value + '\n').join(''));
          fs.appendFileSync(commandFiles[1], 'root=' + root + '\nhome=' + home + '\ntmp=' + tmp + '\noutput=' + output + '\n');
          NODE
      - name: Reject wrong actor, event, ref or workflow before signer admission
        run: node scripts/candidate-admission.mjs

  credential_preflight:
    needs: admission
    environment: hara-desktop-candidate
    env:
      HARA_CANDIDATE_RUNNER_NAME: ${{ vars.HARA_CANDIDATE_RUNNER_NAME }}
      HARA_CANDIDATE_RUNNER_DIRECTORY: ${{ vars.HARA_CANDIDATE_RUNNER_DIRECTORY }}
      HARA_CANDIDATE_OPS_DIRECTORY: ${{ vars.HARA_CANDIDATE_OPS_DIRECTORY }}
      HARA_CANDIDATE_SIGNING_KEYCHAIN: ${{ vars.HARA_CANDIDATE_SIGNING_KEYCHAIN }}
      HARA_CANDIDATE_SIGNING_PASSWORD_FILE: ${{ vars.HARA_CANDIDATE_SIGNING_PASSWORD_FILE }}
      HARA_CANDIDATE_NOTARY_KEY_FILE: ${{ vars.HARA_CANDIDATE_NOTARY_KEY_FILE }}
      HARA_CANDIDATE_NOTARY_KEY_ID: ${{ vars.HARA_CANDIDATE_NOTARY_KEY_ID }}
      HARA_CANDIDATE_NOTARY_ISSUER_ID: ${{ vars.HARA_CANDIDATE_NOTARY_ISSUER_ID }}
      HARA_CANDIDATE_TOOLCHAIN_PATH: ${{ vars.HARA_CANDIDATE_TOOLCHAIN_PATH }}
    runs-on:
      group: hara-desktop-candidate
      labels: [self-hosted, macOS, ARM64, hara-desktop-release]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: orchestration
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: app
          ref: 0731ae1416ffa3c506791d8f454ed850a5079873
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: hara-cli/hara
          path: core
          ref: 282101fc7ea9fc6c7cf360f97859702df2c8a8c1
          persist-credentials: false
      - name: Provision retained job evidence
        id: evidence
        env:
          CANDIDATE_EVIDENCE_ROOT: ${{ github.workspace }}/candidate-evidence/${{ github.run_id }}/${{ github.run_attempt }}/credential_preflight/controller
          CANDIDATE_EVIDENCE_TARGET: controller
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const required = key => { const value = process.env[key]; assert(typeof value === 'string' && value.length > 0 && !/[\r\n\0]/.test(value), 'missing or invalid ' + key); return value; };
          const accountHome = os.userInfo().homedir, uid = process.getuid?.();
          const folded = value => value.replaceAll('\\', '/').toLowerCase();
          const forbidden = ['/tmp', '/private/tmp', '/var/folders', '/private/var/folders', path.join(accountHome, 'Library', 'Caches'), path.join(accountHome, '.hara')].map(folded);
          const canonicalInput = value => { assert(path.isAbsolute(value) && !value.split(/[\\/]/).includes('..'), 'absolute evidence path without traversal required'); const normalized = path.normalize(value); assert(!forbidden.some(prefix => { const f = folded(normalized); return f === prefix || f.startsWith(prefix + '/'); }), 'forbidden evidence prefix'); return normalized; };
          const requested = canonicalInput(required('CANDIDATE_EVIDENCE_ROOT'));
          const workspaceInput = canonicalInput(required('GITHUB_WORKSPACE'));
          const runId = required('GITHUB_RUN_ID'), attempt = required('GITHUB_RUN_ATTEMPT'), job = required('GITHUB_JOB'), target = required('CANDIDATE_EVIDENCE_TARGET');
          assert(/^[1-9][0-9]{0,19}$/.test(runId) && /^[1-9][0-9]{0,5}$/.test(attempt), 'invalid run or attempt');
          assert(/^[a-z][a-z0-9_]{0,47}$/.test(job), 'invalid job');
          assert(['controller', 'aarch64-apple-darwin', 'x86_64-apple-darwin', 'x86_64-unknown-linux-gnu', 'x86_64-pc-windows-msvc'].includes(target), 'invalid evidence target');
          const commandFiles = ['GITHUB_ENV', 'GITHUB_OUTPUT'].map(key => { const file = required(key); assert(path.isAbsolute(file), 'absolute runner command file required'); return file; });
          const identity = directory => {
            const st = fs.lstatSync(directory, { bigint: true });
            assert(st.isDirectory() && !st.isSymbolicLink(), 'plain evidence directory required');
            if (uid !== undefined) assert(Number(st.uid) === uid && (Number(st.mode) & 0o022) === 0, 'unsafe evidence owner or mode');
            assert.equal(fs.realpathSync(directory), directory, 'evidence alias refused');
            return [st.dev, st.ino, st.uid].map(String).join(':');
          };
          assert.equal(fs.realpathSync(workspaceInput), workspaceInput, 'workspace alias refused');
          identity(workspaceInput);
          const parts = ['candidate-evidence', runId, attempt, job, target], root = path.join(workspaceInput, ...parts);
          assert.equal(requested, root, 'evidence must match this exact workspace/run/attempt/job/target');
          for (const file of commandFiles) {
            const st = fs.lstatSync(file, { bigint: true });
            assert(st.isFile() && !st.isSymbolicLink() && Number(st.nlink) === 1, 'plain runner command file required');
            if (uid !== undefined) assert.equal(Number(st.uid), uid, 'foreign runner command file');
          }
          let directory = workspaceInput;
          for (const part of parts.slice(0, -1)) {
            directory = path.join(directory, part);
            try { fs.mkdirSync(directory, { mode: 0o700 }); } catch (error) { if (error.code !== 'EEXIST') throw error; }
            identity(directory);
          }
          // An existing job/attempt leaf is retained and rejected; never reset or delete it.
          fs.mkdirSync(root, { mode: 0o700 }); identity(root);
          const home = path.join(root, 'synthetic-home'), tmp = path.join(root, 'tmp'), output = path.join(tmp, 'output');
          for (const value of [home, tmp, output]) { fs.mkdirSync(value, { mode: 0o700 }); identity(value); }
          const anchors = new Map([root, home, tmp, output].map(value => [value, identity(value)]));
          const authority = { CANDIDATE_EVIDENCE_ROOT: root, HARA_WRAPPER_EVIDENCE_ROOT: root, CANDIDATE_OUTPUT_DIR: output,
            USERPROFILE: home, CFFIXED_USER_HOME: home, HARA_HOME: path.join(home, '.hara'),
            XDG_CONFIG_HOME: path.join(home, '.config'), XDG_DATA_HOME: path.join(home, '.local', 'share'), XDG_CACHE_HOME: path.join(home, '.cache'),
            npm_config_cache: path.join(home, '.npm'), npm_config_userconfig: path.join(home, '.npmrc'), npm_config_globalconfig: path.join(home, '.npmrc-global'),
            npm_config_prefix: path.join(home, '.local'), NO_UPDATE_NOTIFIER: '1', npm_config_update_notifier: 'false', NODE_DISABLE_COMPILE_CACHE: '1',
            TMP: tmp, TEMP: tmp, HOME: home, TMPDIR: tmp };
          for (const [value, expected] of anchors) assert.equal(identity(value), expected, 'evidence identity changed before binding');
          fs.appendFileSync(commandFiles[0], Object.entries(authority).map(([key, value]) => key + '=' + value + '\n').join(''));
          fs.appendFileSync(commandFiles[1], 'root=' + root + '\nhome=' + home + '\ntmp=' + tmp + '\noutput=' + output + '\n');
          NODE
      - name: Select existing pinned local tools without global settings changes
        run: |
          test -n "$HARA_CANDIDATE_TOOLCHAIN_PATH"
          export PATH="$HARA_CANDIDATE_TOOLCHAIN_PATH:$PATH"
          node scripts/candidate-operator-config.mjs select-tools
      - name: Exact source and Pi-only formal hydration before expensive native builds
        run: node scripts/candidate-native.mjs hydrate
      - name: Original updater-file and background Developer ID preflight
        run: node scripts/candidate-signing.mjs preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.output }}/*-preflight.json
          if-no-files-found: error
          retention-days: 7

  native_build:
    needs: credential_preflight
    name: candidate-build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: orchestration
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: app
          ref: 0731ae1416ffa3c506791d8f454ed850a5079873
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: hara-cli/hara
          path: core
          ref: 282101fc7ea9fc6c7cf360f97859702df2c8a8c1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: orchestration/.node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: orchestration/.bun-version
          bun-download-url: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-windows-x64-baseline.zip' || '' }}
      - name: Verify native Windows baseline compiler bytes
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: test "$(sha256sum "$(command -v bun)" | cut -d ' ' -f 1)" = 39f12024edc27d3706baa7b72a06156896b536af61472e0f9a6fe9c5e25b97cc
      - name: Linux build and package extraction dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 libarchive-tools
      - name: Provision retained job evidence
        id: evidence
        env:
          CANDIDATE_EVIDENCE_ROOT: ${{ github.workspace }}/candidate-evidence/${{ github.run_id }}/${{ github.run_attempt }}/native_build/${{ matrix.target }}
          CANDIDATE_EVIDENCE_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const required = key => { const value = process.env[key]; assert(typeof value === 'string' && value.length > 0 && !/[\r\n\0]/.test(value), 'missing or invalid ' + key); return value; };
          const accountHome = os.userInfo().homedir, uid = process.getuid?.();
          const folded = value => value.replaceAll('\\', '/').toLowerCase();
          const forbidden = ['/tmp', '/private/tmp', '/var/folders', '/private/var/folders', path.join(accountHome, 'Library', 'Caches'), path.join(accountHome, '.hara')].map(folded);
          const canonicalInput = value => { assert(path.isAbsolute(value) && !value.split(/[\\/]/).includes('..'), 'absolute evidence path without traversal required'); const normalized = path.normalize(value); assert(!forbidden.some(prefix => { const f = folded(normalized); return f === prefix || f.startsWith(prefix + '/'); }), 'forbidden evidence prefix'); return normalized; };
          const requested = canonicalInput(required('CANDIDATE_EVIDENCE_ROOT'));
          const workspaceInput = canonicalInput(required('GITHUB_WORKSPACE'));
          const runId = required('GITHUB_RUN_ID'), attempt = required('GITHUB_RUN_ATTEMPT'), job = required('GITHUB_JOB'), target = required('CANDIDATE_EVIDENCE_TARGET');
          assert(/^[1-9][0-9]{0,19}$/.test(runId) && /^[1-9][0-9]{0,5}$/.test(attempt), 'invalid run or attempt');
          assert(/^[a-z][a-z0-9_]{0,47}$/.test(job), 'invalid job');
          assert(['controller', 'aarch64-apple-darwin', 'x86_64-apple-darwin', 'x86_64-unknown-linux-gnu', 'x86_64-pc-windows-msvc'].includes(target), 'invalid evidence target');
          const commandFiles = ['GITHUB_ENV', 'GITHUB_OUTPUT'].map(key => { const file = required(key); assert(path.isAbsolute(file), 'absolute runner command file required'); return file; });
          const identity = directory => {
            const st = fs.lstatSync(directory, { bigint: true });
            assert(st.isDirectory() && !st.isSymbolicLink(), 'plain evidence directory required');
            if (uid !== undefined) assert(Number(st.uid) === uid && (Number(st.mode) & 0o022) === 0, 'unsafe evidence owner or mode');
            assert.equal(fs.realpathSync(directory), directory, 'evidence alias refused');
            return [st.dev, st.ino, st.uid].map(String).join(':');
          };
          assert.equal(fs.realpathSync(workspaceInput), workspaceInput, 'workspace alias refused');
          identity(workspaceInput);
          const parts = ['candidate-evidence', runId, attempt, job, target], root = path.join(workspaceInput, ...parts);
          assert.equal(requested, root, 'evidence must match this exact workspace/run/attempt/job/target');
          for (const file of commandFiles) {
            const st = fs.lstatSync(file, { bigint: true });
            assert(st.isFile() && !st.isSymbolicLink() && Number(st.nlink) === 1, 'plain runner command file required');
            if (uid !== undefined) assert.equal(Number(st.uid), uid, 'foreign runner command file');
          }
          let directory = workspaceInput;
          for (const part of parts.slice(0, -1)) {
            directory = path.join(directory, part);
            try { fs.mkdirSync(directory, { mode: 0o700 }); } catch (error) { if (error.code !== 'EEXIST') throw error; }
            identity(directory);
          }
          // An existing job/attempt leaf is retained and rejected; never reset or delete it.
          fs.mkdirSync(root, { mode: 0o700 }); identity(root);
          const home = path.join(root, 'synthetic-home'), tmp = path.join(root, 'tmp'), output = path.join(tmp, 'output');
          for (const value of [home, tmp, output]) { fs.mkdirSync(value, { mode: 0o700 }); identity(value); }
          const anchors = new Map([root, home, tmp, output].map(value => [value, identity(value)]));
          const authority = { CANDIDATE_EVIDENCE_ROOT: root, HARA_WRAPPER_EVIDENCE_ROOT: root, CANDIDATE_OUTPUT_DIR: output,
            USERPROFILE: home, CFFIXED_USER_HOME: home, HARA_HOME: path.join(home, '.hara'),
            XDG_CONFIG_HOME: path.join(home, '.config'), XDG_DATA_HOME: path.join(home, '.local', 'share'), XDG_CACHE_HOME: path.join(home, '.cache'),
            npm_config_cache: path.join(home, '.npm'), npm_config_userconfig: path.join(home, '.npmrc'), npm_config_globalconfig: path.join(home, '.npmrc-global'),
            npm_config_prefix: path.join(home, '.local'), NO_UPDATE_NOTIFIER: '1', npm_config_update_notifier: 'false', NODE_DISABLE_COMPILE_CACHE: '1',
            TMP: tmp, TEMP: tmp, HOME: home, TMPDIR: tmp };
          for (const [value, expected] of anchors) assert.equal(identity(value), expected, 'evidence identity changed before binding');
          fs.appendFileSync(commandFiles[0], Object.entries(authority).map(([key, value]) => key + '=' + value + '\n').join(''));
          fs.appendFileSync(commandFiles[1], 'root=' + root + '\nhome=' + home + '\ntmp=' + tmp + '\noutput=' + output + '\n');
          NODE
      - name: Exact source and Pi-only hydration
        run: node scripts/candidate-native.mjs hydrate
      - name: Core native full suite or Windows CI contracts, complete Desktop tests and renderer
        run: node scripts/candidate-native.mjs tests
      - name: Preserve complete redacted test diagnostics even when the suite fails
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-test-diagnostics-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.evidence.outputs.output }}/*-tests.log
            ${{ steps.evidence.outputs.output }}/*-tests.log.result.json
            ${{ steps.evidence.outputs.output }}/*-tests.json
          if-no-files-found: warn
          retention-days: 7
      - name: Native sidecar boundary smoke and locked Rust tests
        run: node scripts/candidate-native.mjs sidecar
      - name: Complete formal native installer build including Intel DMG
        run: node scripts/candidate-native.mjs build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-unsigned-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.output }}/unsigned-output/*
          if-no-files-found: error
          retention-days: 7

  sign_apps:
    needs: native_build
    environment: hara-desktop-candidate
    env:
      HARA_CANDIDATE_RUNNER_NAME: ${{ vars.HARA_CANDIDATE_RUNNER_NAME }}
      HARA_CANDIDATE_RUNNER_DIRECTORY: ${{ vars.HARA_CANDIDATE_RUNNER_DIRECTORY }}
      HARA_CANDIDATE_OPS_DIRECTORY: ${{ vars.HARA_CANDIDATE_OPS_DIRECTORY }}
      HARA_CANDIDATE_SIGNING_KEYCHAIN: ${{ vars.HARA_CANDIDATE_SIGNING_KEYCHAIN }}
      HARA_CANDIDATE_SIGNING_PASSWORD_FILE: ${{ vars.HARA_CANDIDATE_SIGNING_PASSWORD_FILE }}
      HARA_CANDIDATE_NOTARY_KEY_FILE: ${{ vars.HARA_CANDIDATE_NOTARY_KEY_FILE }}
      HARA_CANDIDATE_NOTARY_KEY_ID: ${{ vars.HARA_CANDIDATE_NOTARY_KEY_ID }}
      HARA_CANDIDATE_NOTARY_ISSUER_ID: ${{ vars.HARA_CANDIDATE_NOTARY_ISSUER_ID }}
      HARA_CANDIDATE_TOOLCHAIN_PATH: ${{ vars.HARA_CANDIDATE_TOOLCHAIN_PATH }}
    runs-on:
      group: hara-desktop-candidate
      labels: [self-hosted, macOS, ARM64, hara-desktop-release]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
