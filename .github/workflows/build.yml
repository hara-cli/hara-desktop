# Tag-driven desktop release pipeline. Native matrix jobs only build and smoke local packages.
# A single aggregation job is the sole writer of the hidden GitHub draft and latest.json. The
# draft remains hidden until controlled macOS signing/notarization replaces both Mac architectures;
# a separate read-only hosted job verifies the exact bytes delivered by the public edge.
name: build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}
  # Hosted runners can carry a machine-level npm mirror. Release inputs must come from the same
  # official registry used by the audit and local preflight, independent of runner image defaults.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  # The pinned CLI tag may contain registry URLs written by an older developer npm configuration.
  # Rewrite every lockfile registry host to the official registry at fetch time.
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  # GitHub's numeric user ID is immutable across username changes. Keep this in source so an
  # ordinary repository writer cannot broaden the stable-tag bypass set at release time.
  HARA_RELEASE_ADMIN_ID: "23243740"
  # SHA-256 of bun.exe inside Bun's official bun-v1.3.9 windows-x64-baseline archive.
  BUN_WINDOWS_BASELINE_SHA256: "39f12024edc27d3706baa7b72a06156896b536af61472e0f9a6fe9c5e25b97cc"

concurrency:
  group: hara-desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      desktop_sha: ${{ steps.release_source.outputs.desktop_sha }}
      cli_sha: ${{ steps.release_source.outputs.cli_sha }}
      cli_version: ${{ steps.release_source.outputs.cli_version }}
      source_artifact_id: ${{ steps.source_pack_upload.outputs.artifact-id }}
      source_artifact_digest: ${{ steps.source_pack_upload.outputs.artifact-digest }}
    steps:
      - name: Require an exact stable tag invocation before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "stable desktop releases require a vX.Y.Z tag: $RELEASE_TAG" >&2
            exit 1
          }
          [ "$GITHUB_EVENT_NAME" = "push" ] || {
            echo "only a pushed stable tag authorizes a release" >&2
            exit 1
          }
          [ "$GITHUB_REF_PROTECTED" = "true" ] || {
            echo "release tag must be protected by the active v* tag ruleset" >&2
            exit 1
          }
          jq -e '.created == true and .forced == false and .deleted == false' "$GITHUB_EVENT_PATH" >/dev/null || {
            echo "only creation of a new stable tag authorizes a release; tag updates/deletions are rejected" >&2
            exit 1
          }
          jq -e --argjson release_admin_id "$HARA_RELEASE_ADMIN_ID" \
            '.sender.id == $release_admin_id' "$GITHUB_EVENT_PATH" >/dev/null || {
            echo "stable tag creation must be performed by the pinned release administrator" >&2
            exit 1
          }
          [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" = "$RELEASE_TAG" ] || {
            echo "release workflow must be invoked from the exact tag ref $RELEASE_TAG" >&2
            exit 1
          }
          [ "$GITHUB_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/build.yml@refs/tags/$RELEASE_TAG" ] || {
            echo "release workflow policy must come from refs/tags/$RELEASE_TAG" >&2
            exit 1
          }
          [ "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA" ] || {
            echo "release workflow policy and tag event must come from the same commit" >&2
            exit 1
          }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event source before executing repository code
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || {
            echo "checkout does not match the tag event commit" >&2
            exit 1
          }
          REMOTE_TAGS="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          REMOTE_TAG_COMMIT="$(awk -v direct="refs/tags/$RELEASE_TAG" -v peeled="refs/tags/$RELEASE_TAG^{}" '
            $2 == peeled { peeled_commit = $1 }
            $2 == direct { direct_commit = $1 }
            END { print peeled_commit ? peeled_commit : direct_commit }
          ' <<<"$REMOTE_TAGS")"
          [ "$REMOTE_TAG_COMMIT" = "$GITHUB_SHA" ] || {
            echo "remote tag moved after the release event: $REMOTE_TAG_COMMIT != $GITHUB_SHA" >&2
            exit 1
          }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
      - name: Validate tag and release metadata
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
        run: node scripts/check-release-metadata.mjs
      - name: Run release-pipeline regression tests
        run: npm test
      - name: Pin exact Desktop and CLI source commits
        id: release_source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "stable desktop releases require a vX.Y.Z tag: $RELEASE_TAG" >&2
            exit 1
          }

          resolve_tag_commit() {
            local repository="$1" tag="$2" refs
            refs="$(git ls-remote --tags "$repository" "refs/tags/$tag" "refs/tags/$tag^{}")"
            awk -v direct="refs/tags/$tag" -v peeled="refs/tags/$tag^{}" '
              $2 == peeled { peeled_commit = $1 }
              $2 == direct { direct_commit = $1 }
              END { print peeled_commit ? peeled_commit : direct_commit }
            ' <<<"$refs"
          }

          DESKTOP_SHA="$(git rev-parse HEAD)"
          [ "$DESKTOP_SHA" = "$GITHUB_SHA" ] || {
            echo "Desktop checkout no longer matches the tag event" >&2
            exit 1
          }
          DESKTOP_TAG_SHA="$(resolve_tag_commit origin "$RELEASE_TAG")"
          [ "$DESKTOP_TAG_SHA" = "$DESKTOP_SHA" ] || {
            echo "desktop tag moved or checkout mismatch: $DESKTOP_TAG_SHA != $DESKTOP_SHA" >&2
            exit 1
          }

          CLI_VERSION="$(tr -d '[:space:]' < src-tauri/binaries/SIDECAR_VERSION)"
          CLI_COMMIT_LOCK="$(tr -d '[:space:]' < src-tauri/binaries/SIDECAR_COMMIT)"
          [[ "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "stable desktop releases require a stable CLI version: $CLI_VERSION" >&2
            exit 1
          }
          CLI_TAG="v$CLI_VERSION"
          CLI_REPOSITORY="https://github.com/hara-cli/hara.git"
          CLI_SHA="$(resolve_tag_commit "$CLI_REPOSITORY" "$CLI_TAG")"
          [[ "$CLI_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "could not resolve $CLI_TAG to a full CLI commit" >&2
            exit 1
          }
          [ "$CLI_SHA" = "$CLI_COMMIT_LOCK" ] || {
            echo "hara-cli $CLI_TAG resolves to $CLI_SHA, Desktop locks $CLI_COMMIT_LOCK" >&2
            exit 1
          }

          CLI_DIR="$RUNNER_TEMP/hara-cli-source"
          git init --quiet "$CLI_DIR"
          git -C "$CLI_DIR" remote add origin "$CLI_REPOSITORY"
          git -C "$CLI_DIR" fetch --quiet --depth 1 origin "refs/tags/$CLI_TAG"
          FETCHED_CLI_SHA="$(git -C "$CLI_DIR" rev-parse 'FETCH_HEAD^{commit}')"
          [ "$FETCHED_CLI_SHA" = "$CLI_SHA" ] || {
            echo "CLI tag moved while pinning: $FETCHED_CLI_SHA != $CLI_SHA" >&2
            exit 1
          }
          git -C "$CLI_DIR" checkout --quiet --detach "$CLI_SHA"
          [ "$(node -p 'require(process.argv[1]).version' "$CLI_DIR/package.json")" = "$CLI_VERSION" ] || {
            echo "hara-cli tag/package version mismatch" >&2
            exit 1
          }

          {
            echo "desktop_sha=$DESKTOP_SHA"
            echo "cli_sha=$CLI_SHA"
            echo "cli_version=$CLI_VERSION"
          } >>"$GITHUB_OUTPUT"
          echo "Pinned desktop $DESKTOP_SHA and hara-cli $CLI_SHA"
      - name: Build compact packs for the exact Desktop and CLI source snapshots
        shell: bash
        env:
          PINNED_DESKTOP_SHA: ${{ steps.release_source.outputs.desktop_sha }}
          PINNED_CLI_SHA: ${{ steps.release_source.outputs.cli_sha }}
          PINNED_CLI_VERSION: ${{ steps.release_source.outputs.cli_version }}
        run: |
          set -euo pipefail
          pack_snapshot() {
            local source_repo="$1" commit_sha="$2" output_pack="$3"
            {
              printf '%s\n' "$commit_sha"
              git -C "$source_repo" rev-list --objects --no-object-names "$commit_sha^{tree}"
            } | LC_ALL=C sort -u | git -C "$source_repo" pack-objects --stdout > "$output_pack"
          }

          PACK_DIR="$RUNNER_TEMP/release-source-packs"
          CLI_DIR="$RUNNER_TEMP/hara-cli-source"
          mkdir -p "$PACK_DIR"
          [ "$(git rev-parse HEAD)" = "$PINNED_DESKTOP_SHA" ]
          [ "$(git -C "$CLI_DIR" rev-parse HEAD)" = "$PINNED_CLI_SHA" ]
          [ -z "$(git status --porcelain)" ]
          [ -z "$(git -C "$CLI_DIR" status --porcelain)" ]

          pack_snapshot "$GITHUB_WORKSPACE" "$PINNED_DESKTOP_SHA" "$PACK_DIR/desktop.pack"
          pack_snapshot "$CLI_DIR" "$PINNED_CLI_SHA" "$PACK_DIR/cli.pack"
          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg desktop_sha "$PINNED_DESKTOP_SHA" \
            --arg desktop_tree "$(git rev-parse "$PINNED_DESKTOP_SHA^{tree}")" \
            --arg cli_version "$PINNED_CLI_VERSION" \
            --arg cli_sha "$PINNED_CLI_SHA" \
            --arg cli_tree "$(git -C "$CLI_DIR" rev-parse "$PINNED_CLI_SHA^{tree}")" \
            '{
              format: 1,
              release_tag: $release_tag,
              desktop_sha: $desktop_sha,
              desktop_tree: $desktop_tree,
              cli_version: $cli_version,
              cli_sha: $cli_sha,
              cli_tree: $cli_tree
            }' > "$PACK_DIR/source-packs.json"
          (
            cd "$PACK_DIR"
            sha256sum desktop.pack cli.pack source-packs.json > source-packs.sha256
          )
      - name: Upload exact release source packs for the protected signer
        id: source_pack_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-source-packs
          path: ${{ runner.temp }}/release-source-packs/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  create_draft:
    name: Create the hidden draft without executing repository code
    needs: [prepare_release, promotion_preflight]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.hidden_draft.outputs.release_id }}
    steps:
      - name: Create or reuse hidden draft release
        id: hidden_draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            [ "$IS_DRAFT" = "true" ] || {
              echo "release $RELEASE_TAG already exists and is not a draft; refusing to replace published assets" >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Hara Desktop $RELEASE_TAG"
          fi
          RELEASE_ID="$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || {
            echo "release $RELEASE_TAG returned an invalid draft database ID" >&2
            exit 1
          }
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare_release, promotion_preflight, create_draft]
    environment:
      name: hara-desktop-production
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dedicated native runners make sidecar execution evidence meaningful. Cross-target
          # compilation never substitutes for --version/--help/serve --help on the real host.
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ needs.prepare_release.outputs.desktop_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: ".bun-version"
          # Bun 1.3.9's Windows cross-target downloader repeatedly fails while extracting the valid
          # baseline runtime package. Run the release with the pinned baseline executable itself so
          # `bun-windows-x64-baseline` is the native target and no second runtime download is needed.
          bun-download-url: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-windows-x64-baseline.zip' || '' }}
      - name: Verify pinned Windows baseline Bun bytes
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA256="$(sha256sum "$(command -v bun)" | awk '{print $1}')"
          [ "$ACTUAL_SHA256" = "$BUN_WINDOWS_BASELINE_SHA256" ] || {
            echo "Windows baseline Bun digest mismatch: $ACTUAL_SHA256" >&2
            exit 1
          }
      - name: Validate pinned build toolchain
        shell: bash
        run: bash scripts/check-build-toolchain.sh
      - name: Validate desktop, tag, and sidecar metadata
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
        run: node scripts/check-release-metadata.mjs
      - name: Linux system dependencies and package extractors
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 \
            libarchive-tools
      - name: Install locked Desktop dependencies with bounded registry retries
        shell: bash
        run: ./scripts/npm-ci-retry.sh
      - name: Audit production dependencies with transient-only retries
        shell: bash
        run: ./scripts/npm-audit-retry.sh
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.HARA_TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || {
            echo "TAURI_SIGNING_PRIVATE_KEY is required for updater artifacts" >&2
            exit 1
          }
      - name: Build and execute-smoke pinned hara sidecar
        shell: bash
        run: |
          set -euo pipefail
          CLI_VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/src-tauri/binaries/SIDECAR_VERSION")"
          PINNED_CLI_VERSION="${{ needs.prepare_release.outputs.cli_version }}"
          CLI_SHA="${{ needs.prepare_release.outputs.cli_sha }}"
          [ "$CLI_VERSION" = "$PINNED_CLI_VERSION" ] || {
            echo "SIDECAR_VERSION changed after source pinning: $CLI_VERSION != $PINNED_CLI_VERSION" >&2
            exit 1
          }
          [[ "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid SIDECAR_VERSION: $CLI_VERSION" >&2
            exit 1
          }
          CLI_DIR="$RUNNER_TEMP/hara-cli"
          git init --quiet "$CLI_DIR"
          git -C "$CLI_DIR" remote add origin https://github.com/hara-cli/hara.git
          git -C "$CLI_DIR" fetch --quiet --depth 1 origin "refs/tags/v${CLI_VERSION}"
          [ "$(git -C "$CLI_DIR" rev-parse 'FETCH_HEAD^{commit}')" = "$CLI_SHA" ] || {
            echo "hara-cli tag moved after source pinning" >&2
            exit 1
          }
          git -C "$CLI_DIR" checkout --quiet --detach "$CLI_SHA"
          cd "$CLI_DIR"
          [ "$(node -p 'require("./package.json").version')" = "$CLI_VERSION" ] || {
            echo "hara-cli tag/package version mismatch" >&2
            exit 1
          }
          npm ci
          npm run build
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)      BUN_TARGET=bun-darwin-arm64 ;;
            x86_64-apple-darwin)       BUN_TARGET=bun-darwin-x64-baseline ;;
            # setup-bun installed and SHA-256-verified the native baseline executable above. Passing
            # the same target again makes Bun 1.3.9 download a second compiler runtime and can time
            # out; an omitted target compiles from the already verified native baseline runtime.
            x86_64-pc-windows-msvc)    BUN_TARGET="" ;;
            x86_64-unknown-linux-gnu)  BUN_TARGET=bun-linux-x64-baseline ;;
            *) echo "unsupported sidecar target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          EXT=""
          case "${{ matrix.target }}" in
            *windows*) EXT=".exe" ;;
          esac
          for attempt in 1 2 3; do
            rm -f dist/bin/hara-sidecar dist/bin/hara-sidecar.exe
            if [ -n "$BUN_TARGET" ]; then
              BUILD_COMMAND=(bun scripts/build-binary.ts dist/bin/hara-sidecar "$BUN_TARGET")
            else
              BUILD_COMMAND=(bun scripts/build-binary.ts dist/bin/hara-sidecar)
            fi
            if "${BUILD_COMMAND[@]}"; then
              break
            fi
            [ "$attempt" -lt 3 ] || {
              echo "sidecar compilation failed after $attempt attempts" >&2
              exit 1
            }
            echo "sidecar compilation attempt $attempt failed; retrying a possibly incomplete Bun target download" >&2
            sleep $((attempt * 5))
          done
          [ "$(git -C "$CLI_DIR" rev-parse HEAD)" = "$CLI_SHA" ] || {
            echo "hara-cli HEAD changed while building the sidecar" >&2
            exit 1
          }
          CLI_STATUS="$(git -C "$CLI_DIR" status --porcelain)"
          [ -z "$CLI_STATUS" ] || {
            echo "hara-cli source changed while building the sidecar" >&2
            git -C "$CLI_DIR" status --short >&2
            exit 1
          }
          node "$GITHUB_WORKSPACE/scripts/sidecar-smoke.mjs" \
            "dist/bin/hara-sidecar${EXT}" "$CLI_VERSION" "${{ matrix.target }}"
          mkdir -p "$GITHUB_WORKSPACE/src-tauri/binaries"
          cp "dist/bin/hara-sidecar${EXT}" \
            "$GITHUB_WORKSPACE/src-tauri/binaries/hara-${{ matrix.target }}${EXT}"
      - name: Build local packages (no release API access)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.HARA_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          NO_STRIP: "true"
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            # linuxdeploy is unreliable for this large sidecar; updater-supported deb+rpm ship.
            npm run tauri build -- --target "${{ matrix.target }}" --bundles deb,rpm
          else
            npm run tauri build -- --target "${{ matrix.target }}"
          fi
      - name: Package smoke (sidecar extracted from real installer/updater packages)
        shell: bash
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: node scripts/package-smoke.mjs
      - name: Collect canonical release assets after smoke
        shell: bash
        run: >-
          node scripts/collect-release-assets.mjs
          "${{ matrix.target }}"
          "$RUNNER_TEMP/release-assets-${{ matrix.target }}"
          "${{ needs.prepare_release.outputs.desktop_sha }}"
          "${{ needs.prepare_release.outputs.cli_sha }}"
      - name: Upload verified matrix assets for single-writer assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets-${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 7

  assemble_draft:
    name: Assemble verified hidden draft (do not publish unsigned macOS assets)
    needs: [prepare_release, build, create_draft]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ needs.prepare_release.outputs.desktop_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
      - name: Download all verified matrix assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-assets-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Build exact updater manifest once
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-matrix-receipts.mjs \
            "$RUNNER_TEMP/release-assets" \
            "${{ needs.prepare_release.outputs.desktop_sha }}" \
            "${{ needs.prepare_release.outputs.cli_sha }}"
          node scripts/release-source-provenance.mjs build \
            "$RUNNER_TEMP/release-assets/release-source-provenance.json" \
            "$RELEASE_TAG" \
            "${{ needs.prepare_release.outputs.desktop_sha }}" \
            "${{ needs.prepare_release.outputs.cli_sha }}"
          PUB_DATE="$(git show -s --format=%cI HEAD)"
          node scripts/updater-manifest.mjs build "$RUNNER_TEMP/release-assets" "$RELEASE_TAG" "$PUB_DATE"
      - name: Copy the exact source artifact into the hidden Release transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ needs.prepare_release.outputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.prepare_release.outputs.source_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[0-9]+$ ]] || {
            echo "the source artifact ID is missing or invalid" >&2
            exit 1
          }
          EXPECTED_ARTIFACT_SHA="${SOURCE_ARTIFACT_DIGEST#sha256:}"
          [[ "$EXPECTED_ARTIFACT_SHA" =~ ^[0-9a-f]{64}$ ]] || {
            echo "the source artifact digest is missing or invalid" >&2
            exit 1
          }

          SOURCE_ARCHIVE_DIR="$RUNNER_TEMP/release-source-archive"
          SOURCE_ARCHIVE="$SOURCE_ARCHIVE_DIR/Hara_${RELEASE_TAG#v}_source-packs.zip"
          SOURCE_ARCHIVE_PARTIAL="${SOURCE_ARCHIVE}.partial"
          mkdir -p "$SOURCE_ARCHIVE_DIR"
          for source_attempt in 1 2 3; do
            rm -f "$SOURCE_ARCHIVE_PARTIAL"
            if timeout --signal=KILL 330s gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
              > "$SOURCE_ARCHIVE_PARTIAL"; then
              ACTUAL_ARTIFACT_SHA="$(sha256sum "$SOURCE_ARCHIVE_PARTIAL" | awk '{print $1}')"
              if [ "$ACTUAL_ARTIFACT_SHA" = "$EXPECTED_ARTIFACT_SHA" ]; then
                mv "$SOURCE_ARCHIVE_PARTIAL" "$SOURCE_ARCHIVE"
                break
              fi
            fi
            rm -f "$SOURCE_ARCHIVE_PARTIAL"
            [ "$source_attempt" -lt 3 ] || {
              echo "could not copy the digest-bound source artifact into Release transport" >&2
              exit 1
            }
            echo "source artifact copy incomplete ($source_attempt/3); retrying after a bounded delay" >&2
            sleep $((source_attempt * 3))
          done
          [ "$(sha256sum "$SOURCE_ARCHIVE" | awk '{print $1}')" = "$EXPECTED_ARTIFACT_SHA" ]
          unzip -tq "$SOURCE_ARCHIVE" >/dev/null
      - name: Confirm release tags still match the pinned commits
        shell: bash
        run: |
          set -euo pipefail
          resolve_tag_commit() {
            local repository="$1" tag="$2" refs
            refs="$(git ls-remote --tags "$repository" "refs/tags/$tag" "refs/tags/$tag^{}")"
            awk -v direct="refs/tags/$tag" -v peeled="refs/tags/$tag^{}" '
              $2 == peeled { peeled_commit = $1 }
              $2 == direct { direct_commit = $1 }
              END { print peeled_commit ? peeled_commit : direct_commit }
            ' <<<"$refs"
          }
          [ "$(resolve_tag_commit origin "$RELEASE_TAG")" = "${{ needs.prepare_release.outputs.desktop_sha }}" ]
          [ "$(resolve_tag_commit https://github.com/hara-cli/hara.git "v${{ needs.prepare_release.outputs.cli_version }}")" = \
            "${{ needs.prepare_release.outputs.cli_sha }}" ]
      - name: Replace hidden draft assets after every native gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create_draft.outputs.release_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || {
            echo "create_draft did not provide a valid release database ID" >&2
            exit 1
          }
          RELEASE_STATE="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq '[.tag_name, .draft] | @tsv'
          )"
          [ "$RELEASE_STATE" = "$RELEASE_TAG"$'\t'true ] || {
            echo "release ID $RELEASE_ID is not the expected hidden draft for $RELEASE_TAG" >&2
            exit 1
          }
          mapfile -t EXISTING_ASSET_IDS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].id'
          )
          for asset_id in "${EXISTING_ASSET_IDS[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done

          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP"/release-assets/* \
            "$RUNNER_TEMP/release-source-archive/Hara_${RELEASE_TAG#v}_source-packs.zip"
      - name: Download the exact remote draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/remote-release-assets"
          mkdir -p "$VERIFY_DIR"
          node scripts/github-release-download.mjs \
            "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$VERIFY_DIR"
      - name: Revalidate downloaded draft and source archive without a release token
        shell: bash
        env:
          SOURCE_ARTIFACT_DIGEST: ${{ needs.prepare_release.outputs.source_artifact_digest }}
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/remote-release-assets"
          SOURCE_ARCHIVE="$VERIFY_DIR/Hara_${RELEASE_TAG#v}_source-packs.zip"
          EXPECTED_ARTIFACT_SHA="${SOURCE_ARTIFACT_DIGEST#sha256:}"
          [[ "$EXPECTED_ARTIFACT_SHA" =~ ^[0-9a-f]{64}$ ]]
          [ -s "$SOURCE_ARCHIVE" ]
          [ "$(sha256sum "$SOURCE_ARCHIVE" | awk '{print $1}')" = "$EXPECTED_ARTIFACT_SHA" ]
          SOURCE_VERIFY_DIR="$RUNNER_TEMP/remote-release-source-packs"
          mkdir -p "$SOURCE_VERIFY_DIR"
          unzip -q "$SOURCE_ARCHIVE" -d "$SOURCE_VERIFY_DIR"
          (
            cd "$SOURCE_VERIFY_DIR"
            sha256sum -c source-packs.sha256
          )
          rm -f "$SOURCE_ARCHIVE"
          node scripts/updater-manifest.mjs validate "$VERIFY_DIR" "$RELEASE_TAG"
          node scripts/release-source-provenance.mjs validate \
            "$VERIFY_DIR/release-source-provenance.json" \
            "$RELEASE_TAG" \
            "${{ needs.prepare_release.outputs.desktop_sha }}" \
            "${{ needs.prepare_release.outputs.cli_sha }}"
      - name: Confirm the remote release remains a hidden draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]
          echo "Draft $RELEASE_TAG is complete but intentionally hidden."
          echo "The protected signing job will now promote $RELEASE_TAG automatically."

  promotion_preflight:
    name: Verify protected signing infrastructure
    needs: prepare_release
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.event.created == true &&
      github.event.forced == false &&
      github.event.deleted == false
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require the exact stable tag workflow
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "stable promotion requires a vX.Y.Z tag: $RELEASE_TAG" >&2
            exit 1
          }
          [ "$GITHUB_EVENT_NAME" = "push" ] || {
            echo "only the pushed stable tag run may promote a release" >&2
            exit 1
          }
          [ "$GITHUB_REF_PROTECTED" = "true" ] || {
            echo "release tag is not protected by the required v* tag ruleset" >&2
            exit 1
          }
          jq -e '.created == true and .forced == false and .deleted == false' "$GITHUB_EVENT_PATH" >/dev/null || {
            echo "only the original stable tag creation run may promote a release" >&2
            exit 1
          }
          [ "$GITHUB_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/build.yml@refs/tags/$RELEASE_TAG" ] || {
            echo "release promotion must run from the exact pushed tag workflow" >&2
            exit 1
          }
          [ "$GITHUB_SHA" = "${{ needs.prepare_release.outputs.desktop_sha }}" ] || {
            echo "tag event commit does not match the pinned Desktop source" >&2
            exit 1
          }
          jq -e --argjson release_admin_id "$HARA_RELEASE_ADMIN_ID" \
            '.sender.id == $release_admin_id' "$GITHUB_EVENT_PATH" >/dev/null || {
            echo "stable tag creation must be performed by the pinned release administrator" >&2
            exit 1
          }

      - name: Require the tag-scoped release environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh_api_read() {
            local attempt output
            for attempt in 1 2 3; do
              if output="$(timeout --signal=KILL 45s gh api "$@")"; then
                printf '%s\n' "$output"
                return 0
              fi
              [ "$attempt" -lt 3 ] || return 1
              echo "GitHub API read failed ($attempt/3); retrying after a bounded delay" >&2
              sleep $((attempt * 2))
            done
          }
          CUSTOM_POLICIES="$(
            gh_api_read "repos/$GITHUB_REPOSITORY/environments/hara-desktop-production" \
              --jq '.deployment_branch_policy.custom_branch_policies'
          )"
          [ "$CUSTOM_POLICIES" = "true" ] || {
            echo "hara-desktop-production must use custom deployment branch/tag policies" >&2
            exit 1
          }
          REQUIRED_REVIEW_RULES="$(
            gh_api_read "repos/$GITHUB_REPOSITORY/environments/hara-desktop-production" \
              --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length'
          )"
          [ "$REQUIRED_REVIEW_RULES" -eq 0 ] || {
            echo "the pushed stable tag is the release authorization; remove the second manual environment approval" >&2
            exit 1
          }
          DEPLOYMENT_POLICIES="$(
            gh_api_read \
              "repos/$GITHUB_REPOSITORY/environments/hara-desktop-production/deployment-branch-policies?per_page=100" \
              --paginate \
              --jq '.branch_policies[]? | [.type, .name] | @tsv'
          )"
          TOTAL_POLICY_COUNT="$(awk 'NF { count++ } END { print count + 0 }' <<<"$DEPLOYMENT_POLICIES")"
          TAG_POLICY_COUNT="$(awk -F '\t' '$1 == "tag" && $2 == "v*" { count++ } END { print count + 0 }' \
            <<<"$DEPLOYMENT_POLICIES")"
          [ "$TOTAL_POLICY_COUNT" -eq 1 ] && [ "$TAG_POLICY_COUNT" -eq 1 ] || {
            echo "hara-desktop-production must contain exactly one deployment policy: tag v*" >&2
            exit 1
          }

  sign_and_promote:
    name: Sign, notarize, verify, and promote automatically
    needs: [prepare_release, create_draft, assemble_draft, promotion_preflight]
    permissions:
      actions: read
      contents: write
    environment:
      name: hara-desktop-production
      url: https://github.com/hara-cli/hara-desktop/releases/tag/${{ env.RELEASE_TAG }}
    runs-on: [self-hosted, macOS, ARM64, hara-desktop-release]
    timeout-minutes: 180
    env:
      HARA_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/source-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Materialize exact release sources from the digest-bound Release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create_draft.outputs.release_id }}
          PINNED_DESKTOP_SHA: ${{ needs.prepare_release.outputs.desktop_sha }}
          PINNED_CLI_SHA: ${{ needs.prepare_release.outputs.cli_sha }}
          PINNED_CLI_VERSION: ${{ needs.prepare_release.outputs.cli_version }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.prepare_release.outputs.source_artifact_digest }}
        run: |
          set -euo pipefail
          [ ! -e "$HARA_RELEASE_SOURCE_ROOT" ] || {
            echo "release source root already exists for this run attempt" >&2
            exit 1
          }
          EXPECTED_ARTIFACT_SHA="${SOURCE_ARTIFACT_DIGEST#sha256:}"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || {
            echo "the exact Release ID is missing or invalid" >&2
            exit 1
          }
          [[ "$EXPECTED_ARTIFACT_SHA" =~ ^[0-9a-f]{64}$ ]] || {
            echo "the source artifact digest is missing or invalid" >&2
            exit 1
          }

          mkdir -p "$HARA_RELEASE_SOURCE_ROOT"
          ARTIFACT_ZIP="$HARA_RELEASE_SOURCE_ROOT/source-packs.zip"
          ARTIFACT_PARTIAL="${ARTIFACT_ZIP}.partial"
          RELEASE_METADATA="$HARA_RELEASE_SOURCE_ROOT/release.json"
          RELEASE_METADATA_PARTIAL="${RELEASE_METADATA}.partial"
          SOURCE_METADATA="$HARA_RELEASE_SOURCE_ROOT/source-release-asset.json"
          SOURCE_ASSET_NAME="Hara_${RELEASE_TAG#v}_source-packs.zip"
          RELEASE_API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"

          run_with_deadline() {
            local deadline_seconds="$1"
            shift
            "$@" <&0 &
            local command_pid=$!
            (
              sleep "$deadline_seconds"
              kill -TERM "$command_pid" 2>/dev/null || exit 0
              sleep 5
              kill -KILL "$command_pid" 2>/dev/null || true
            ) &
            local watchdog_pid=$!
            local command_exit_code=0
            if wait "$command_pid"; then
              command_exit_code=0
            else
              command_exit_code=$?
            fi
            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true
            return "$command_exit_code"
          }

          umask 077
          METADATA_COMPLETE=0
          for metadata_attempt in 1 2 3; do
            rm -f "$RELEASE_METADATA" "$RELEASE_METADATA_PARTIAL" "$SOURCE_METADATA"
            if {
              printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN"
              printf 'header = "Accept: application/vnd.github+json"\n'
              printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
            } | run_with_deadline 120 /usr/bin/env GH_TOKEN='' GITHUB_TOKEN='' /usr/bin/curl \
              --disable \
              --http1.1 \
              --proto '=https' \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 2 \
              --retry-max-time 90 \
              --connect-timeout 20 \
              --max-time 100 \
              --speed-limit 128 \
              --speed-time 30 \
              --output "$RELEASE_METADATA_PARTIAL" \
              --config - \
              "$RELEASE_API_URL" && \
              jq -e \
                --argjson release_id "$RELEASE_ID" \
                --arg tag "$RELEASE_TAG" '
                  .id == $release_id and
                  .tag_name == $tag and
                  .prerelease == false and
                  (
                    .draft == true or
                    (
                      .draft == false and
                      .immutable == true and
                      (.published_at | type == "string" and length > 0)
                    )
                  )
                ' "$RELEASE_METADATA_PARTIAL" >/dev/null && \
              mv "$RELEASE_METADATA_PARTIAL" "$RELEASE_METADATA" && \
              jq --arg name "$SOURCE_ASSET_NAME" '
                [.assets[] | select(.name == $name)] |
                if length == 1 then .[0] else error("expected exactly one source archive") end
              ' "$RELEASE_METADATA" > "$SOURCE_METADATA" && \
              jq -e \
                --arg name "$SOURCE_ASSET_NAME" \
                --arg digest "sha256:$EXPECTED_ARTIFACT_SHA" '
                  .name == $name and
                  .state == "uploaded" and
                  .digest == $digest and
                  (.size | type == "number" and . > 0) and
                  (.id | type == "number" and . > 0)
                ' "$SOURCE_METADATA" >/dev/null; then
              METADATA_COMPLETE=1
              break
            fi
            [ "$metadata_attempt" -lt 3 ] || break
            echo "source Release asset metadata incomplete ($metadata_attempt/3); retrying after a bounded delay" >&2
            sleep $((metadata_attempt * 3))
          done
          [ "$METADATA_COMPLETE" = "1" ] || {
            echo "could not resolve the digest-bound source Release asset" >&2
            exit 1
          }

          RELEASE_IS_DRAFT="$(jq -r .draft "$RELEASE_METADATA")"
          if [ "$RELEASE_IS_DRAFT" = "false" ]; then
            run_with_deadline 120 gh release verify "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null || {
              echo "the public Release is not covered by a valid immutable attestation" >&2
              exit 1
            }
            echo "Verified immutable public Release before materializing its exact source archive."
          fi

          SOURCE_ASSET_ID="$(jq -r .id "$SOURCE_METADATA")"
          SOURCE_ASSET_SIZE="$(jq -r .size "$SOURCE_METADATA")"
          SOURCE_ASSET_API_URL="$(jq -r .url "$SOURCE_METADATA")"
          [[ "$SOURCE_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_ASSET_SIZE" =~ ^[1-9][0-9]*$ ]]
          [ "$SOURCE_ASSET_API_URL" = \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$SOURCE_ASSET_ID" ] || {
            echo "source Release asset API URL is outside the expected repository" >&2
            exit 1
          }

          : > "$ARTIFACT_PARTIAL"
          DOWNLOAD_COMPLETE=0
          for download_attempt in 1 2 3; do
            {
              printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN"
              printf 'header = "Accept: application/octet-stream"\n'
              printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
            } | run_with_deadline 600 /usr/bin/env GH_TOKEN='' GITHUB_TOKEN='' /usr/bin/curl \
              --disable \
              --http1.1 \
              --proto '=https' \
              --proto-redir '=https' \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --retry-max-time 540 \
              --connect-timeout 20 \
              --max-time 570 \
              --speed-limit 1024 \
              --speed-time 60 \
              --continue-at - \
              --output "$ARTIFACT_PARTIAL" \
              --config - \
              "$SOURCE_ASSET_API_URL" || true
            if [ "$(stat -f %z "$ARTIFACT_PARTIAL")" = "$SOURCE_ASSET_SIZE" ] && \
              [ "$(shasum -a 256 "$ARTIFACT_PARTIAL" | awk '{print $1}')" = "$EXPECTED_ARTIFACT_SHA" ]; then
              mv "$ARTIFACT_PARTIAL" "$ARTIFACT_ZIP"
              DOWNLOAD_COMPLETE=1
              break
            fi
            [ "$download_attempt" -lt 3 ] || break
            echo "source Release archive transfer incomplete ($download_attempt/3); resuming after a bounded delay" >&2
            sleep $((download_attempt * 3))
          done
          [ "$DOWNLOAD_COMPLETE" = "1" ] || {
            rm -f "$ARTIFACT_PARTIAL"
            echo "could not download the exact source Release archive after bounded resumable attempts" >&2
            exit 1
          }

          PACK_DIR="$HARA_RELEASE_SOURCE_ROOT/packs"
          mkdir -p "$PACK_DIR"
          /usr/bin/ditto -x -k "$ARTIFACT_ZIP" "$PACK_DIR"
          (
            cd "$PACK_DIR"
            shasum -a 256 -c source-packs.sha256
          )
          jq -e \
            --arg release_tag "$RELEASE_TAG" \
            --arg desktop_sha "$PINNED_DESKTOP_SHA" \
            --arg cli_version "$PINNED_CLI_VERSION" \
            --arg cli_sha "$PINNED_CLI_SHA" '
              .format == 1 and
              .release_tag == $release_tag and
              .desktop_sha == $desktop_sha and
              .cli_version == $cli_version and
              .cli_sha == $cli_sha and
              (.desktop_tree | test("^[0-9a-f]{40}$")) and
              (.cli_tree | test("^[0-9a-f]{40}$"))
            ' "$PACK_DIR/source-packs.json" >/dev/null

          materialize_snapshot() {
            local pack_file="$1" target_dir="$2" commit_sha="$3" tree_sha="$4" tag="$5" remote_url="$6"
            mkdir -p "$target_dir"
            /usr/bin/git init -q "$target_dir"
            /usr/bin/git -C "$target_dir" config core.autocrlf false
            /usr/bin/git -C "$target_dir" index-pack --stdin < "$pack_file" >/dev/null
            printf '%s\n' "$commit_sha" > "$target_dir/.git/shallow"
            /usr/bin/git -C "$target_dir" update-ref "refs/tags/$tag" "$commit_sha"
            /usr/bin/git -C "$target_dir" remote add origin "$remote_url"
            /usr/bin/git -C "$target_dir" checkout --quiet --detach "$commit_sha"
            [ "$(/usr/bin/git -C "$target_dir" rev-parse HEAD)" = "$commit_sha" ]
            [ "$(/usr/bin/git -C "$target_dir" rev-parse "$commit_sha^{tree}")" = "$tree_sha" ]
            [ -z "$(/usr/bin/git -C "$target_dir" status --porcelain)" ]
          }
          DESKTOP_TREE="$(jq -r .desktop_tree "$PACK_DIR/source-packs.json")"
          CLI_TREE="$(jq -r .cli_tree "$PACK_DIR/source-packs.json")"
          materialize_snapshot \
            "$PACK_DIR/desktop.pack" \
            "$HARA_RELEASE_SOURCE_ROOT/hara-desktop" \
            "$PINNED_DESKTOP_SHA" "$DESKTOP_TREE" "$RELEASE_TAG" \
            "https://github.com/hara-cli/hara-desktop.git"
          materialize_snapshot \
            "$PACK_DIR/cli.pack" \
            "$HARA_RELEASE_SOURCE_ROOT/hara-cli" \
            "$PINNED_CLI_SHA" "$CLI_TREE" "v$PINNED_CLI_VERSION" \
            "https://github.com/hara-cli/hara.git"

          NODE_VERSION="$(tr -d '[:space:]' < "$HARA_RELEASE_SOURCE_ROOT/hara-desktop/.node-version")"
          NODE_BIN="$HOME/.nvm/versions/node/v$NODE_VERSION/bin"
          BUN_BIN="$HOME/.bun/bin"
          CARGO_BIN="$HOME/.cargo/bin"
          [ -x "$NODE_BIN/node" ] && [ -x "$BUN_BIN/bun" ] && [ -x "$CARGO_BIN/rustup" ] || {
            echo "the controlled signing host is missing a pinned release toolchain" >&2
            exit 1
          }
          printf '%s\n' "$NODE_BIN" "$BUN_BIN" "$CARGO_BIN" >> "$GITHUB_PATH"

      - name: Validate pinned release sources and metadata
        working-directory: ${{ env.HARA_RELEASE_SOURCE_ROOT }}/hara-desktop
        shell: bash
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
          PINNED_DESKTOP_SHA: ${{ needs.prepare_release.outputs.desktop_sha }}
          PINNED_CLI_SHA: ${{ needs.prepare_release.outputs.cli_sha }}
          PINNED_CLI_VERSION: ${{ needs.prepare_release.outputs.cli_version }}
        run: |
          set -euo pipefail
          node scripts/check-release-metadata.mjs
          [ "$(git rev-parse HEAD)" = "$PINNED_DESKTOP_SHA" ]
          [ "$(git -C ../hara-cli rev-parse HEAD)" = "$PINNED_CLI_SHA" ]
          [ "$(git -C ../hara-cli rev-parse "refs/tags/v${PINNED_CLI_VERSION}^{commit}")" = "$PINNED_CLI_SHA" ]
          [ "$(tr -d '[:space:]' < src-tauri/binaries/SIDECAR_COMMIT)" = "$PINNED_CLI_SHA" ]
          [ "$(node -p 'require(process.argv[1]).version' ../hara-cli/package.json)" = "$PINNED_CLI_VERSION" ]

      - name: Require immutable releases and the restricted stable-tag ruleset before signing
        working-directory: ${{ env.HARA_RELEASE_SOURCE_ROOT }}/hara-desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HARA_RELEASE_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || {
            echo "HARA_RELEASE_POLICY_TOKEN is required from the protected environment" >&2
            exit 1
          }
          IMMUTABLE_ENABLED="$(
            node scripts/github-api-read.mjs \
              "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled
          )" || {
            echo "could not read the immutable-release policy after bounded retries" >&2
            exit 1
          }
          [ "$IMMUTABLE_ENABLED" = "true" ] || {
            echo "immutable releases must be enabled before signing or promotion" >&2
            exit 1
          }
          RULESET_IDS="$(
            node scripts/github-api-read.mjs \
              "repos/$GITHUB_REPOSITORY/rulesets?targets=tag&per_page=100" \
              --paginate --jq '.[].id'
          )" || {
            echo "could not list stable-tag rulesets after bounded retries" >&2
            exit 1
          }
          RULESET_OK=0
          while IFS= read -r ruleset_id; do
            [ -n "$ruleset_id" ] || continue
            RULESET_JSON="$(
              node scripts/github-api-read.mjs \
                "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id"
            )" || {
              echo "could not read tag ruleset $ruleset_id after bounded retries" >&2
              exit 1
            }
            if jq -e \
              --argjson release_admin_id "$HARA_RELEASE_ADMIN_ID" '
              .target == "tag" and
              .enforcement == "active" and
              (.conditions.ref_name.include | index("refs/tags/v*") != null) and
              ([.rules[].type] | index("creation") != null and index("update") != null and index("deletion") != null) and
              (.bypass_actors | length == 1) and
              (.bypass_actors[0].actor_type == "User") and
              (.bypass_actors[0].actor_id == $release_admin_id) and
              (.bypass_actors[0].bypass_mode == "always")
            ' >/dev/null <<<"$RULESET_JSON"; then
              RULESET_OK=1
              break
            fi
          done <<<"$RULESET_IDS"
          [ "$RULESET_OK" = "1" ] || {
            echo "stable v* tags must restrict creation, update, and deletion to exactly the pinned release administrator" >&2
            exit 1
          }

      - name: Install locked Desktop dependencies
        working-directory: ${{ env.HARA_RELEASE_SOURCE_ROOT }}/hara-desktop
        shell: bash
        run: ./scripts/npm-ci-retry.sh

      - name: Re-run release-pipeline regression tests on the signing host
        working-directory: ${{ env.HARA_RELEASE_SOURCE_ROOT }}/hara-desktop
        run: npm test

      - name: Build signed and notarized arm64 assets
        working-directory: ${{ env.HARA_RELEASE_SOURCE_ROOT }}/hara-desktop
        shell: bash
        run: ./scripts/build-mac-signed.sh

      - name: Build signed and notarized Intel assets with foreign-architecture inspection
        working-directory: ${{ env.HARA_RELEASE_SOURCE_ROOT }}/hara-desktop
        shell: bash
        env:
          HARA_MAC_TARGET: x86_64-apple-darwin
          # The x64 matrix job already execute-smoked every package on macos-15-intel. The protected
          # ARM signing host verifies architecture, signatures, notarization, and staples without
          # depending on the host-wide health of Rosetta.
          HARA_FOREIGN_MAC_STATIC_VALIDATION: "1"
          HARA_PROTECTED_SIGNING_JOB: ${{ github.run_id }}
        run: ./scripts/build-mac-signed.sh

      - name: Merge signed assets and atomically expose the verified release
        working-directory: ${{ env.HARA_RELEASE_SOURCE_ROOT }}/hara-desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HARA_RELEASE_POLICY_TOKEN: ${{ secrets.HARA_RELEASE_POLICY_TOKEN }}
          HARA_PROMOTION_WORKFLOW_LOCK: ${{ github.run_id }}
          HARA_PROMOTION_TAG: ${{ env.RELEASE_TAG }}
          HARA_DRAFT_ASSEMBLED_RUN_ID: ${{ github.run_id }}
          HARA_PROTECTED_SIGNING_JOB: ${{ github.run_id }}
          HARA_RELEASE_SOURCE_ARTIFACT_DIGEST: ${{ needs.prepare_release.outputs.source_artifact_digest }}
          HARA_DEFER_PUBLIC_EDGE_VERIFY: "1"
        run: ./scripts/release-mac-assets.sh "$RELEASE_TAG"

      - name: Remove the run-scoped release source checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_root="$GITHUB_WORKSPACE/source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [ "$HARA_RELEASE_SOURCE_ROOT" = "$expected_root" ] || {
            echo "refusing to remove an unexpected release source root" >&2
            exit 1
          }
          if [ -d "$HARA_RELEASE_SOURCE_ROOT" ]; then
            rm -rf -- "$HARA_RELEASE_SOURCE_ROOT"
          fi

  verify_public_release:
    name: Verify immutable release through the public GitHub edge
    needs: [prepare_release, sign_and_promote]
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Require the exact protected stable tag after promotion
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "public verification requires a vX.Y.Z tag" >&2
            exit 1
          }
          [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ] || {
            echo "public verification is limited to the pushed stable tag run" >&2
            exit 1
          }
          [ "$GITHUB_REF_PROTECTED" = "true" ] || {
            echo "public verification tag is not protected" >&2
            exit 1
          }
          [ "$GITHUB_WORKFLOW_REF" = \
            "$GITHUB_REPOSITORY/.github/workflows/build.yml@refs/tags/$RELEASE_TAG" ] || {
            echo "public verification workflow does not come from the exact stable tag" >&2
            exit 1
          }
          [ "$GITHUB_SHA" = "${{ needs.prepare_release.outputs.desktop_sha }}" ] || {
            echo "public verification commit does not match the pinned Desktop source" >&2
            exit 1
          }

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out public-verifier source
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || {
            echo "public verifier checkout does not match the tag event commit" >&2
            exit 1
          }
          REMOTE_TAG_COMMIT="$(node scripts/resolve-remote-tag.mjs . origin "$RELEASE_TAG")"
          [ "$REMOTE_TAG_COMMIT" = "$GITHUB_SHA" ] || {
            echo "public verifier tag moved after publication" >&2
            exit 1
          }

      - name: Verify attested public DMGs, Gatekeeper trust, and latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-public-release-edge.sh "$RELEASE_TAG"
