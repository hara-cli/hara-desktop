name: Windows split install smoke

on:
  workflow_call:
    inputs:
      desktop_sha:
        required: true
        type: string
      core_sha:
        required: true
        type: string
      transfer_id:
        required: true
        type: string
      transfer_sha256:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
      release_only:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  install:
    name: Windows install smoke (${{ matrix.installer }})
    strategy:
      fail-fast: false
      matrix:
        installer: [msi, nsis]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINDOWS_DESKTOP_SHA: ${{ inputs.desktop_sha }}
      WINDOWS_CORE_SHA: ${{ inputs.core_sha }}
      WINDOWS_TRANSFER_ID: ${{ inputs.transfer_id }}
      WINDOWS_TRANSFER_SHA256: ${{ inputs.transfer_sha256 }}
      WINDOWS_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      WINDOWS_RELEASE_ONLY: ${{ inputs.release_only }}
      WINDOWS_INSTALLER: ${{ matrix.installer }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ inputs.desktop_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - name: Require an exact transfer identity
        shell: bash
        run: |
          [[ "$WINDOWS_TRANSFER_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$WINDOWS_TRANSFER_SHA256" =~ ^[a-f0-9]{64}$ && "$WINDOWS_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
      - name: Download exact Windows install transfer ZIP
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ inputs.transfer_id }}
          path: ${{ runner.temp }}/windows-install-zip
          skip-decompress: true
          digest-mismatch: error
      - name: Rehash ZIP and verify exact Desktop and Core installer inputs
        shell: bash
        run: node scripts/windows-install-transfer.mjs receive
      - name: Verify this VM's installer registry preflight
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          node scripts/windows-install-smoke.mjs "$RUNNER_TEMP/windows-install-transfer" "$RUNNER_TEMP/windows-install-precheck" "--${WINDOWS_INSTALLER}-precheck-only"
          node scripts/windows-install-transfer.mjs precheck "$WINDOWS_INSTALLER"
      - name: Preserve preflight and transfer proof before running the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-install-${{ matrix.installer }}-precheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-transfer-readback.json
            ${{ runner.temp }}/windows-install-precheck/windows-install-smoke.json
            ${{ runner.temp }}/windows-install-precheck/windows-install-progress.jsonl
          if-no-files-found: error
          retention-days: 7
      - name: Verify installed credentials, restart, rotation and uninstall
        id: installed
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          args=("--${WINDOWS_INSTALLER}-only")
          if [ "$WINDOWS_RELEASE_ONLY" = "true" ]; then args+=(--release-only); fi
          node scripts/windows-install-smoke.mjs "$RUNNER_TEMP/windows-install-transfer" "$RUNNER_TEMP/windows-installed-smoke" "${args[@]}"
          node scripts/windows-install-transfer.mjs installed "$WINDOWS_INSTALLER"
      - name: Preserve the installer receipt and phase markers
        if: always() && (steps.installed.outcome == 'success' || steps.installed.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-install-${{ matrix.installer }}-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-installed-smoke/windows-install-smoke.json
            ${{ runner.temp }}/windows-installed-smoke/windows-install-progress.jsonl
          if-no-files-found: error
          retention-days: 7
